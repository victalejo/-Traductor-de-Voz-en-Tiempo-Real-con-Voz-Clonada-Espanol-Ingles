name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Avoid installing heavy ML deps in CI — tests use stubs in conftest.py.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy python-dotenv

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        env:
          ELEVENLABS_API_KEY: test-key-ci
        run: pytest
